# Strict-evidence defaults intentionally leave unresolved values as null.
# For an explicit playable engineering profile, put the verified ImprovedFarm.schem
# in plugins/CubeCraftTowerDefence/maps/ and run /ctdplaytestsetup apply as OP.
# The command backs up this strict config and requires a full server restart.


# World binding is intentionally unset by default. No world/origin is guessed.
map-binding:
  world: null
  origin:
    x: null
    y: null
    z: null

  # Original Farm branch-selection rule is unresolved.
  # Use /ctdmapplan to inspect compiled route IDs, then set one explicit route
  # per attacked team. There is no hidden first/random route fallback.
  route-assignment:
    red: null
    blue: null

  # Original Castle Guard positions are unresolved.
  # Exactly two real-world x,y,z anchors are required per team.
  guard-anchors:
    red: []
    blue: []

  # Original player spawn markers are not recoverable from the verified
  # schematic. Set real-world x,y,z explicitly.
  player-spawn:
    red: null
    blue: null

  # Safe default: OFF. When enabled, /ctdpastefarm still refuses any destination
  # region containing a non-air block, and verifies the exact Farm SHA-256.
  allow-farm-paste: false
  paste-blocks-per-tick: 4000

